<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CardioView — Explainable cardiac risk visualization</title>
  <desc id="desc">A glowing stylized heart and three coloured coronary vessels on a dark medical technology background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".56" stop-color="#0c2031"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#1d92b6" stop-opacity=".28"/><stop offset="1" stop-color="#1d92b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="myocardium" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#ff8c95"/><stop offset=".45" stop-color="#bd3e59"/><stop offset="1" stop-color="#481b35"/></linearGradient>
    <linearGradient id="artery" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe1c6"/><stop offset=".55" stop-color="#ff786a"/><stop offset="1" stop-color="#e94754"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86e2ff"/><stop offset="1" stop-color="#2584ba"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7cc9e8" stroke-opacity=".08" stroke-width="1"/><circle cx="0" cy="0" r="1.3" fill="#8bdcf7" fill-opacity=".2"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <ellipse cx="885" cy="174" rx="280" ry="230" fill="url(#halo)"/>
  <path d="M0 277 C160 245 247 307 390 258 S625 274 748 225" fill="none" stroke="#2aa8c6" stroke-opacity=".24" stroke-width="2"/>
  <path d="M0 292 H86 L106 292 L119 278 L135 309 L151 292 H226 L240 292 L252 285 L264 299 L276 292 H360" fill="none" stroke="#31b7ce" stroke-opacity=".44" stroke-width="2"/>
  <g fill="#5ed8eb" fill-opacity=".52"><circle cx="106" cy="292" r="3"/><circle cx="252" cy="285" r="3"/><circle cx="748" cy="225" r="3"/><circle cx="1082" cy="83" r="3"/></g>
  <g transform="translate(70 68)">
    <text x="0" y="0" fill="#78d8e9" font-size="13" font-weight="700" letter-spacing="3" font-family="Inter,Segoe UI,sans-serif">EXPLAINABLE CARDIAC ML</text>
    <text x="0" y="67" fill="#f4f8ff" font-size="58" font-weight="760" letter-spacing="-2" font-family="Inter,Segoe UI,sans-serif">CardioView</text>
    <text x="2" y="103" fill="#b8c9d9" font-size="19" font-family="Inter,Segoe UI,sans-serif">Make cardiac risk easier to see.</text>
    <path d="M2 127 H372" stroke="#46748d" stroke-opacity=".65"/>
    <g transform="translate(0 150)" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600">
      <rect width="112" height="31" rx="15.5" fill="#163347" stroke="#2a687c"/><text x="56" y="20" text-anchor="middle" fill="#b8edf4">3D VESSELS</text>
      <rect x="123" width="119" height="31" rx="15.5" fill="#163347" stroke="#2a687c"/><text x="182.5" y="20" text-anchor="middle" fill="#b8edf4">SHAP FACTORS</text>
      <rect x="253" width="116" height="31" rx="15.5" fill="#163347" stroke="#2a687c"/><text x="311" y="20" text-anchor="middle" fill="#b8edf4">LIVE MODELS</text>
    </g>
  </g>
  <g transform="translate(820 15)">
    <ellipse cx="130" cy="287" rx="145" ry="20" fill="#050b13" fill-opacity=".6" filter="url(#shadow)"/>
    <g fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M111 117 C99 83 91 48 109 22 C121 5 145 6 151 27 L159 90" stroke-width="27"/><path d="M168 98 C177 70 190 43 218 35 C234 30 245 46 238 62 L213 113" stroke-width="23"/></g>
    <path d="M160 112 C123 73 69 78 43 118 C8 171 48 229 153 284 C252 231 295 175 266 120 C242 77 193 77 160 112Z" fill="url(#myocardium)" stroke="#ffb0b7" stroke-opacity=".76" stroke-width="2.5"/>
    <path d="M81 130 C102 110 131 108 151 124 C174 143 184 169 171 207 C164 231 157 256 153 284 C129 258 101 236 79 208 C57 181 57 151 81 130Z" fill="#f75d71" fill-opacity=".23"/>
    <path d="M179 125 C204 104 238 114 251 140 C264 165 245 196 222 219 C203 238 181 259 153 284 C168 236 192 195 187 164 C185 148 181 135 179 125Z" fill="#4b1633" fill-opacity=".45"/>
    <path d="M161 119 C183 142 185 166 178 191 C172 216 160 246 153 278" fill="none" stroke="#6d243a" stroke-width="20" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M151 122 C130 116 108 120 95 139 C82 158 94 174 115 177 C136 179 145 165 151 152" stroke="#51e2a0" stroke-width="9"/><path d="M160 123 C176 142 177 165 171 190 C167 214 159 246 153 276" stroke="url(#artery)" stroke-width="10"/><path d="M166 130 C198 118 223 129 231 149 C238 166 223 182 204 193" stroke="#ffb54a" stroke-width="9"/></g>
    <g fill="none" stroke-linecap="round" stroke-width="4"><path d="M110 140 L95 128 M121 171 L108 187 M177 169 L193 160 M167 211 L184 220 M211 191 L224 205" stroke="#ffcfba" stroke-opacity=".85"/><path d="M151 150 L137 144 M159 188 L146 198 M157 230 L143 242" stroke="#ffd2b8" stroke-opacity=".8"/></g>
    <g fill="#f8fbff" stroke-width="3"><circle cx="95" cy="139" r="5" stroke="#51e2a0"/><circle cx="173" cy="183" r="5" stroke="#ff786a"/><circle cx="229" cy="151" r="5" stroke="#ffb54a"/></g>
    <g font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700"><path d="M95 139 H16" stroke="#51e2a0" stroke-opacity=".8"/><text x="10" y="132" text-anchor="start" fill="#a8f7d4">LAD</text><path d="M229 151 H292" stroke="#ffb54a" stroke-opacity=".8"/><text x="298" y="155" fill="#ffd79a">LCX</text><path d="M173 183 H285" stroke="#ff786a" stroke-opacity=".8"/><text x="291" y="187" fill="#ffb5b7">RCA</text></g>
  </g>
  <text x="1160" y="312" text-anchor="end" fill="#7fa2b5" font-size="10" letter-spacing="1.5" font-family="Inter,Segoe UI,sans-serif">EDUCATIONAL PROTOTYPE</text>
</svg>